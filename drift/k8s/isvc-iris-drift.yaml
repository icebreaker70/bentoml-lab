# 추론 로그를 남기는 InferenceService.
# predictor.logger 를 지정하면 KServe 가 파드에 agent 컨테이너를 넣고,
# 요청과 응답을 CloudEvent 로 logger.url 에 비동기 전송한다.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: iris-drift
  namespace: kubeflow-user-example-com
spec:
  predictor:
    minReplicas: 1            # 포트포워딩으로 호출하므로 0개로 줄이지 않는다
    logger:
      mode: all               # all | request | response
      url: http://inference-logger.kubeflow-user-example-com.svc.cluster.local
    model:
      modelFormat: {name: sklearn}
      storageUri: gs://kfserving-examples/models/sklearn/1.0/model
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "1", memory: 1Gi}
